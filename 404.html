<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="页面未找到 - 邓洁产品经理作品集">
    <title>页面走丢了 | 邓洁 · 产品经理</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%236C5CE7'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EDJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        .error-page {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }
        .error-page .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .5;
            z-index: 0;
            pointer-events: none;
        }
        .error-page .blob-1 {
            width: 420px; height: 420px;
            background: var(--purple);
            opacity: .18;
            top: -120px; left: -100px;
            animation: float-slow 14s ease-in-out infinite;
        }
        .error-page .blob-2 {
            width: 380px; height: 380px;
            background: var(--teal);
            opacity: .16;
            bottom: -120px; right: -90px;
            animation: float-slow 16s ease-in-out infinite reverse;
        }
        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.08); }
        }
        .error-card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 560px;
            width: 100%;
        }
        .error-code {
            font-size: clamp(6rem, 22vw, 11rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.04em;
            background: var(--gradient-full);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0;
            filter: drop-shadow(0 10px 30px rgba(108, 92, 231, .18));
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: .85rem;
            font-weight: 500;
            margin: 18px 0 14px;
        }
        .error-badge .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 0 4px rgba(0, 206, 201, .18);
        }
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 12px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.8;
            margin: 0 auto 30px;
            max-width: 420px;
        }
        .error-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <button class="theme-toggle error-theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <main class="error-card">
            <p class="error-code">404</p>
            <div class="error-badge">
                <span class="status-dot"></span>
                这个页面可能还没排期
            </div>
            <h1 class="error-title">页面走丢了</h1>
            <p class="error-desc">
                你访问的链接不存在或已被移动。别担心，好产品值得多走一步——
                回到首页，继续看看我的作品与经历。
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    返回首页
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></svg>
                </a>
                <a href="index.html#portfolio" class="btn btn-ghost">查看作品集</a>
            </div>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        themeToggle.addEventListener('click', () => {
            const isDark = (root.getAttribute('data-theme') || 'light') === 'dark';
            if (isDark) root.removeAttribute('data-theme');
            else root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
